---
- name: Install Rust package with fallback to locked
  block:
    - name: "Install Rust package without locked: {{ package }}"
      community.general.cargo:
        name: "{{ package }}"
        locked: false
  rescue:
    - name: "Retry install with locked: {{ package }}"
      community.general.cargo:
        name: "{{ package }}"
        locked: true
